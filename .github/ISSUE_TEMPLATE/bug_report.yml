name: Bug report
description: 使用合成数据描述问题，不提交秘密或个人资料
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment and pinned versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: 已移除凭据、Cookie、私人文件与真实业务数据。
          required: true
